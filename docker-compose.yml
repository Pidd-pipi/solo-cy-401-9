name: gigmatch

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-gigmatch}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-gigmatch}
      MYSQL_USER: ${DB_USER:-gigmatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gigmatch123}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-33301}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${DB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-gigmatch}-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gigmatch}
      DB_USER: ${DB_USER:-gigmatch}
      DB_PASSWORD: ${DB_PASSWORD:-gigmatch123}
      JWT_SECRET: ${JWT_SECRET:-gigmatch-dev-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:28030}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME_MIN: ${DB_CONN_MAX_LIFETIME_MIN:-5}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-10}
      DB_CONNECT_RETRY_INTERVAL_SEC: ${DB_CONNECT_RETRY_INTERVAL_SEC:-3}
      UPLOAD_DIR: /tmp/gigmatch-uploads
    ports:
      - "${BACKEND_PORT:-29068}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-gigmatch}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28030}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
